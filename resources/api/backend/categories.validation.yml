post:
    categoryKey:
        - NotBlank
        - Length:
              max: 255

    templateName:
        - NotBlank
        - Length:
              max: 255

    parentCategoryKey:
        - Optional:
              constraints:
                  - Length:
                        max: 255

    position:
        - Optional:
              constraints:
                  - GreaterThanOrEqual:
                        value: 0

    extraParentCategoryKeys:
        - Optional:
              constraints:
                  - All:
                        constraints:
                            - NotBlank

    stores:
        - Optional:
              constraints:
                  - All:
                        constraints:
                            - NotBlank

    localizedAttributes:
        - NotBlank
        - All:
              constraints:
                  - Collection:
                        allowMissingFields: true
                        fields:
                            localeName:
                                - NotBlank
                            name:
                                - NotBlank
                                - Length:
                                      max: 255
                            metaTitle:
                                - Optional:
                                      constraints:
                                          - Length:
                                                max: 255
                            metaDescription:
                                - Optional:
                                      constraints: []
                            metaKeywords:
                                - Optional:
                                      constraints: []

    imageSets:
        - Optional:
              constraints:
                  - All:
                        constraints:
                            - Collection:
                                  allowMissingFields: true
                                  fields:
                                      localeName:
                                          - NotBlank
                                      name:
                                          - NotBlank

patch:
    templateName:
        - Optional:
              constraints:
                  - NotBlank
                  - Length:
                        max: 255

    parentCategoryKey:
        - Optional:
              constraints:
                  - Length:
                        max: 255

    position:
        - Optional:
              constraints:
                  - GreaterThanOrEqual:
                        value: 0

    extraParentCategoryKeys:
        - Optional:
              constraints:
                  - All:
                        constraints:
                            - NotBlank

    stores:
        - Optional:
              constraints:
                  - All:
                        constraints:
                            - NotBlank

    localizedAttributes:
        - Optional:
              constraints:
                  - All:
                        constraints:
                            - Collection:
                                  allowMissingFields: true
                                  fields:
                                      localeName:
                                          - NotBlank
                                      name:
                                          - Optional:
                                                constraints:
                                                    - NotBlank
                                                    - Length:
                                                          max: 255

    imageSets:
        - Optional:
              constraints:
                  - All:
                        constraints:
                            - Collection:
                                  allowMissingFields: true
                                  fields:
                                      localeName:
                                          - NotBlank
                                      name:
                                          - NotBlank
